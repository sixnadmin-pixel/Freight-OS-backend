services:
  app:
    image: thaarushi/freightos:latest
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRESS_CONN_STR: 

volumes:
  pgdata:
